<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MadeByDian · Avondmenu</title><style>body{font:16px system-ui;background:#fbf5e9;color:#362d2d;margin:0}main{max-width:720px;margin:auto;padding:18px}h1,h2{font-family:Georgia,serif;color:#793f4b}section{background:#fffdf9;border:1px solid #e8d7c8;border-radius:18px;padding:16px;margin:12px 0}button{font:inherit;padding:10px 13px;border:0;border-radius:10px;background:#793f4b;color:white}button.alt{background:#ede2d8;color:#793f4b}a{color:#793f4b}.muted{color:#756c67;font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}summary{cursor:pointer}.shopping label{display:block;margin:8px 0}</style><main><a href="/">← Terug naar de hoofdapp</a><h1>Avondeten · Weekmenu</h1><p>Maandag t/m vrijdag. Dit menu wordt ook opgeslagen in het weekmenu van je hoofdapp.</p><section><button id="gen">Maak mijn avondmenu</button><p id="status" class="muted"></p></section><div id="days"></div><section><h2>Boodschappenlijst</h2><p class="muted">De hoeveelheden zijn nog niet omgerekend naar het aantal personen. AH-weekprijzen worden nog niet automatisch opgehaald.</p><div id="shopping" class="shopping"></div><button class="alt" id="copy">Kopieer lijst</button></section></main><script>const KEY='madebydian-recipes-filled-copy-v0.5',H='mbd_recipe_ratings_history_v1';const $=id=>document.getElementById(id);let state,h={},days=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag'];try{state=JSON.parse(localStorage.getItem(KEY)||'null');h=JSON.parse(localStorage.getItem(H)||'{}')||{}}catch{}if(!state?.recipes||!state.week)document.getElementById('status').textContent='Open eerst de hoofdapp op hetzelfde apparaat.';const ident=r=>r.mdb||r.id;function lunch(r){return /flatbread|smoothie|shake|tosti|sandwich|ontbijt|breakfast|lunch|croissant|granola|havermout|pannenkoek|wafel|salade op brood|wrap met ei/i.test(r.title||'')}function allowed(r){if(!r.ingredients||!r.steps||lunch(r))return false;const stars=h[ident(r)]?.stars||0;if(stars===1||stars===2)return false;const t=(r.title||'').toLowerCase();if(/meta processes|create an account|log in|privacy|cookies|instagram|facebook/.test(t))return false;const ingredients=(r.ingredients||'').toLowerCase();if(/garnaal|scampi|schaaldier|spruitjes|witlof|pinda|cashew|amandel|hazelnoot|walnoot/.test(ingredients))return false;return true}const patterns=[/soep/i,/(taco|burrito|wrap|tortilla)/i,/(restje|rijst|aardappel|soep|diepvries|stamppot)/i,/(oven|traybake|ovenschotel)/i,/(pasta|rijst|aardappel|kip|zalm|vis|burger)/i];function candidates(i,exclude){let pool=state.recipes.filter(r=>allowed(r)&&!exclude.has(r.id));let matching=pool.filter(r=>patterns[i].test((r.title||'')+' '+(r.category||'')));return matching.length?matching:pool}function pick(i,exclude){const pool=candidates(i,exclude);if(!pool.length)return null;const weight=r=>{const n=h[ident(r)]?.stars||0;return n===5?7:n===4?5:n===3?1:2};let sum=pool.reduce((s,r)=>s+weight(r),0),x=Math.random()*sum;for(const r of pool){x-=weight(r);if(x<=0)return r}return pool[0]}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));render();$('status').textContent='Weekmenu opgeslagen. Het is nu ook zichtbaar onder Weekmenu in de hoofdapp.'}catch(e){$('status').textContent='Opslaan mislukt: '+e.message}}function generate(){if(!state?.recipes)return;const used=new Set();for(let i=0;i<5;i++){const r=pick(i,used);if(r){state.week[days[i]]=r.id;used.add(r.id)}else delete state.week[days[i]]}save()}function replace(i){const used=new Set(days.filter((d,j)=>j!==i).map(d=>state.week[d]).filter(Boolean));const r=pick(i,used);if(r){state.week[days[i]]=r.id;save()}}function render(){if(!state?.recipes)return;const host=$('days');host.replaceChildren();const list=[];days.forEach((day,i)=>{const r=state.recipes.find(x=>x.id===state.week[day]);const sec=document.createElement('section');const head=document.createElement('div');head.className='row';const t=document.createElement('div');const strong=document.createElement('strong');strong.textContent=day;t.append(strong,document.createElement('br'),document.createTextNode(r?(r.mdb||'Zonder MDB-nummer')+' · '+r.title:'Nog geen avondgerecht gekozen'));const b=document.createElement('button');b.className='alt';b.textContent='Vervangen';b.onclick=()=>replace(i);head.append(t,b);sec.append(head);if(r){const details=document.createElement('details');const sum=document.createElement('summary');sum.textContent='Ingrediënten en bereiding';const p=document.createElement('p');p.style.whiteSpace='pre-wrap';p.textContent=r.ingredients+'\n\n'+r.steps;details.append(sum,p);sec.append(details);list.push(...r.ingredients.split('\n').map(x=>x.replace(/^[•*\-]\s*/,'').trim()).filter(Boolean))}host.append(sec)});const shopping=$('shopping');shopping.replaceChildren();for(const x of [...new Set(list)]){const l=document.createElement('label');const c=document.createElement('input');c.type='checkbox';l.append(c,document.createTextNode(' '+x));shopping.append(l)}}$('gen').onclick=generate;$('copy').onclick=()=>{const t=[...$('shopping').querySelectorAll('label')].map(x=>x.textContent).join('\n');navigator.clipboard.writeText(t).then(()=>$('status').textContent='Lijst gekopieerd').catch(()=>$('status').textContent='Kopiëren niet gelukt')};render();</script></html>
