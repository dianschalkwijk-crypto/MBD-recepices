<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MadeByDian · Mijn beoordelingen</title><style>body{font:16px system-ui;background:#f7f3ef;color:#302729;margin:0}main{max-width:720px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}a{color:#704d52}h1{font-size:26px}button,select,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #d6c8c1;background:white}button{cursor:pointer}.active{background:#704d52;color:white}.recipe{background:white;border:1px solid #e4d9d2;border-radius:14px;padding:15px;margin:12px 0}.stars{display:flex;gap:2px}.star{border:0;font-size:26px;color:#aaa;background:transparent;padding:2px}.star.on{color:#bd8734}.muted{color:#756a66;font-size:13px}.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:10px 0}.pill{font-size:13px}#message{white-space:pre-wrap}</style><main><header><a href="/">← Receptenapp</a><a href="/account.html">Mijn account</a></header><h1>Mijn sterren & kookgeschiedenis</h1><p>Geef je recepten 1 tot 5 sterren en houd bij wanneer je ze hebt gekookt. Alleen jouw beoordelingen tellen mee voor jouw weekmenu.</p><div class="row"><input id="search" placeholder="Zoek recept of MDB-nummer" style="flex:1;min-width:160px"><select id="filter"><option value="all">Alle recepten</option><option value="5">Alleen 5 sterren</option><option value="4plus">4 en 5 sterren</option><option value="3">3 sterren</option><option value="low">1 en 2 sterren</option><option value="unrated">Nog niet beoordeeld</option><option value="cooked">Eerder gekookt</option></select></div><p id="count" class="muted"></p><p id="message" role="status"></p><div id="list"></div></main><script>const KEY='madebydian-recipes-filled-copy-v0.5',HISTORY='mbd_recipe_ratings_history_v1';const $=id=>document.getElementById(id);let state=null,records={};try{state=JSON.parse(localStorage.getItem(KEY)||'null');records=JSON.parse(localStorage.getItem(HISTORY)||'{}')||{}}catch{}if(!state||!Array.isArray(state.recipes)){$('message').textContent='Geen lokale receptenbibliotheek gevonden. Open eerst de hoofdapp op dit apparaat.'}const key=r=>r.mdb||r.id;function save(){try{localStorage.setItem(HISTORY,JSON.stringify(records))}catch(e){$('message').textContent='Opslaan mislukt: '+e.message}}function rec(id){return records[id]||(records[id]={stars:0,cooked:[]})}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){if(!state)return;const q=$('search').value.toLowerCase().trim(),f=$('filter').value;const items=state.recipes.filter(r=>{const d=records[key(r)]||{},n=d.stars||0;if(q&&!String(r.title+' '+key(r)).toLowerCase().includes(q))return false;return f==='all'||f==='5'&&n===5||f==='4plus'&&n>=4||f==='3'&&n===3||f==='low'&&n>0&&n<=2||f==='unrated'&&!n||f==='cooked'&&(d.cooked||[]).length>0});$('count').textContent=items.length+' van '+state.recipes.length+' recepten';$('list').replaceChildren();for(const r of items.slice(0,250)){const id=key(r),d=records[id]||{},n=d.stars||0;const box=document.createElement('article');box.className='recipe';const title=document.createElement('strong');title.textContent=(r.mdb?r.mdb+' · ':'')+r.title;box.append(title);const row=document.createElement('div');row.className='row stars';row.setAttribute('aria-label','Beoordeling');for(let i=1;i<=5;i++){const b=document.createElement('button');b.className='star'+(i<=n?' on':'');b.textContent=i<=n?'★':'☆';b.title=i+' sterren';b.setAttribute('aria-label',i+' sterren geven');b.onclick=()=>{rec(id).stars=i;save();render()};row.append(b)}box.append(row);const info=document.createElement('p');info.className='muted';const dates=d.cooked||[];info.textContent=dates.length?'Gekookt: '+dates.length+'× · Laatste keer: '+dates[dates.length-1]: 'Nog niet als gekookt geregistreerd';box.append(info);const actions=document.createElement('div');actions.className='row';const cook=document.createElement('button');cook.className='pill';cook.textContent='✓ Vandaag gekookt';cook.onclick=()=>{const today=new Date().toLocaleDateString('sv-SE');if((rec(id).cooked||[]).includes(today)){if(!confirm('Vandaag staat al geregistreerd. Nogmaals toevoegen?'))return}rec(id).cooked.push(today);save();render()};actions.append(cook);if(n){const clear=document.createElement('button');clear.className='pill';clear.textContent='Beoordeling wissen';clear.onclick=()=>{rec(id).stars=0;save();render()};actions.append(clear)}box.append(actions);$('list').append(box)}if(items.length>250){const p=document.createElement('p');p.className='muted';p.textContent='Eerste 250 resultaten getoond. Gebruik zoeken om meer te vinden.';$('list').append(p)}}$('search').oninput=render;$('filter').onchange=render;render();</script></html>
